<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Foot Measure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .camera-card { background: white; border-radius: 30px; padding: 20px; margin-bottom: 20px; }
        .camera-container { position: relative; background: #000; border-radius: 20px; overflow: hidden; aspect-ratio: 3/4; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; }
        .border-guide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 4px solid #ff4444; border-radius: 20px; pointer-events: none; z-index: 10; }
        .border-guide.perfect { border-color: #4CAF50; }
        .instruction { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; text-align: center; padding: 12px; border-radius: 25px; z-index: 10; font-size: 14px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 12px; border: none; border-radius: 25px; cursor: pointer; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: bold; }
        .reference-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .ref-btn { flex: 1; padding: 10px; background: #f0f0f0; border: 2px solid #ddd; border-radius: 25px; cursor: pointer; text-align: center; }
        .ref-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }
        .results { display: none; margin-top: 20px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0; }
        .size-card { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); border-radius: 15px; padding: 15px; text-align: center; }
        .size-value { font-size: 28px; font-weight: bold; color: #764ba2; }
        .info-box { background: #e8f5e9; border-radius: 15px; padding: 15px; margin: 15px 0; text-align: center; }
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #764ba2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .popup-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            display: none;
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .btn-reset { background: #764ba2; margin-top: 10px; }
        @media (max-width: 768px) { .size-grid { grid-template-columns: 1fr; } .popup-toast { font-size: 14px; padding: 10px 20px; white-space: nowrap; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-card">
            <div class="reference-selector">
                <div class="ref-btn active" data-ref="hand">🖐️ Hand Reference</div>
                <div class="ref-btn" data-ref="card">💳 Credit Card</div>
                <div class="ref-btn" data-ref="paper">📄 A4 Paper</div>
            </div>
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="border-guide" id="borderGuide"></div>
                <div class="instruction" id="instruction">🖐️ Place HAND next to FOOT</div>
            </div>
            <div class="controls">
                <button onclick="manualCapture()">📸 Capture</button>
                <button onclick="window.location.href='/reset'">🔄 Reset</button>
            </div>
            <div class="loader" id="loader"><div class="spinner"></div><p>AI analyzing...</p></div>
            <div class="results" id="results">
                <div class="result-card">
                    <h3>👟 Your Shoe Sizes</h3>
                    <div class="size-grid">
                        <div class="size-card"><div>🇺🇸 US</div><div class="size-value" id="usSize">-</div></div>
                        <div class="size-card"><div>🇬🇧 UK</div><div class="size-value" id="ukSize">-</div></div>
                        <div class="size-card"><div>🇪🇺 EU</div><div class="size-value" id="euSize">-</div></div>
                    </div>
                </div>
                <div class="result-card">
                    <h3>📏 Measured Length</h3>
                    <div class="info-box"><span id="footLength">--</span> cm</div>
                </div>
                <button class="btn-reset" onclick="resetApp()">🔄 Recapture</button>
                <button class="btn-reset" onclick="downloadPDF()">📄 Download PDF</button>
            </div>
        </div>
    </div>
    <div id="popupToast" class="popup-toast"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let captureInterval = null;
        let isAutoCaptureEnabled = true;
        let currentRef = 'hand';

        function showPopup(message, isError = true) {
            const toast = document.getElementById('popupToast');
            toast.style.backgroundColor = isError ? '#ff4444' : '#4CAF50';
            toast.innerHTML = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        document.querySelectorAll('.ref-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ref-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRef = btn.dataset.ref;
                let msg = '';
                if (currentRef === 'hand') msg = '🖐️ Place HAND next to FOOT';
                else if (currentRef === 'card') msg = '💳 Place CREDIT CARD next to FOOT';
                else msg = '📄 Place A4 PAPER next to FOOT';
                document.getElementById('instruction').innerHTML = msg;
            });
        });

        window.addEventListener('load', function() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            isAutoCaptureEnabled = true;
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                await video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                startAutoDetection();
            } catch (err) {
                showPopup('❌ Camera access denied. Please allow camera permission.', true);
            }
        }

        function startAutoDetection() {
            captureInterval = setInterval(() => {
                if (video.videoWidth > 0 && isAutoCaptureEnabled) analyzeFrame();
            }, 500);
        }

        function analyzeFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: canvas.toDataURL('image/jpeg'), 
                    frame_height: canvas.height,
                    reference: currentRef
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.foot_cm) {
                    const ratio = 50; // dummy
                    if (isAutoCaptureEnabled) {
                        document.getElementById('borderGuide').classList.add('perfect');
                        document.getElementById('instruction').innerHTML = '✅ Perfect! Capturing...';
                        isAutoCaptureEnabled = false;
                        setTimeout(() => autoCapture(), 500);
                    }
                } else if (data.error === 'foot_not_found') {
                    document.getElementById('borderGuide').classList.remove('perfect');
                    document.getElementById('instruction').innerHTML = '📱 Place FOOT in frame';
                    showPopup('❌ FOOT NOT FOUND! Please place your foot clearly.', true);
                } else if (data.error === 'reference_not_found') {
                    document.getElementById('borderGuide').classList.remove('perfect');
                    let msg = currentRef === 'hand' ? 'HAND' : (currentRef === 'card' ? 'CREDIT CARD' : 'A4 PAPER');
                    document.getElementById('instruction').innerHTML = `📱 Place ${msg} next to foot`;
                    showPopup(`❌ REFERENCE NOT FOUND! Please place your ${msg} next to your foot.`, true);
                }
            });
        }

        function autoCapture() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            document.getElementById('loader').style.display = 'block';
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image: canvas.toDataURL('image/jpeg'), 
                    frame_height: canvas.height,
                    reference: currentRef
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                if (data.success) {
                    document.getElementById('footLength').textContent = data.foot_cm;
                    document.getElementById('usSize').textContent = data.sizes.US;
                    document.getElementById('ukSize').textContent = data.sizes.UK;
                    document.getElementById('euSize').textContent = data.sizes.EU;
                    document.getElementById('results').style.display = 'block';
                    if (captureInterval) clearInterval(captureInterval);
                    showPopup('✅ Measurement successful!', false);
                } else if (data.error === 'foot_not_found') {
                    showPopup('❌ FOOT NOT FOUND! Please place your foot clearly.', true);
                    isAutoCaptureEnabled = true;
                } else if (data.error === 'reference_not_found') {
                    let msg = currentRef === 'hand' ? 'HAND' : (currentRef === 'card' ? 'CREDIT CARD' : 'A4 PAPER');
                    showPopup(`❌ REFERENCE NOT FOUND! Please place your ${msg} next to your foot.`, true);
                    isAutoCaptureEnabled = true;
                } else {
                    showPopup('⚠️ Could not measure. Please try again.', true);
                    isAutoCaptureEnabled = true;
                }
            });
        }

        function manualCapture() { isAutoCaptureEnabled = false; autoCapture(); }
        function resetApp() { location.reload(); }
        function downloadPDF() { showPopup('📄 PDF download coming soon!', false); }
        
        startCamera();
    </script>
</body>
</html>
