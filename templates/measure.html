<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Measure Your Foot - Smart Foot Measure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .camera-card {
            background: white;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 3/4;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas { position: absolute; top: 0; left: 0; }
        .border-guide {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid #ff4444;
            border-radius: 20px;
            transition: border-color 0.1s;
            pointer-events: none;
            z-index: 10;
        }
        .border-guide.perfect { border-color: #4CAF50; }
        .foot-outline {
            position: absolute;
            bottom: 20%;
            left: 15%;
            right: 15%;
            height: 40%;
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 60px 60px 30px 30px;
            pointer-events: none;
            z-index: 10;
        }
        .guide-image {
            background: #f0f0f0;
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .guide-image img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
        }
        .guide-text {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 25px;
            z-index: 10;
        }
        .distance-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
            z-index: 10;
        }
        .distance-fill { height: 100%; width: 0%; background: #4CAF50; transition: width 0.1s; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
        }
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 25px;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-card">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="border-guide" id="borderGuide"></div>
                <div class="foot-outline"></div>
                <div class="distance-bar"><div class="distance-fill" id="distanceFill"></div></div>
                <div class="instruction" id="instruction">📱 Move until green line fills</div>
            </div>

            <div class="guide-image">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'%3E%3Cpath d='M100,20 C130,20 160,80 160,150 C160,220 140,270 100,280 C60,270 40,220 40,150 C40,80 70,20 100,20Z' fill='%23f5e6d3' stroke='%23764ba2' stroke-width='2'/%3E%3Cline x1='40' y1='150' x2='160' y2='150' stroke='%23ff4444' stroke-width='2' stroke-dasharray='5,5'/%3E%3Ctext x='165' y='150' fill='%23ff4444' font-size='12'%3EWidth%3C/text%3E%3Cline x1='100' y1='20' x2='100' y2='280' stroke='%234CAF50' stroke-width='2' stroke-dasharray='5,5'/%3E%3Ctext x='80' y='15' fill='%234CAF50' font-size='12'%3ELength from heel to longest toe%3C/text%3E%3C/svg%3E"
                     alt="Foot measurement guide">
                <div class="guide-text">✅ Place foot flat, camera above. Move until top bar turns GREEN.</div>
            </div>

            <div class="controls">
                <button onclick="window.location.href='/reset'">🔄 Reset</button>
            </div>
            <div class="loader" id="loader"><div class="spinner"></div><p>Measuring...</p></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let captureInterval = null;
        let isProcessing = false;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                await video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                startAutoDetection();
            } catch (err) {
                showToast('❌ Camera access denied');
            }
        }

        function startAutoDetection() {
            if (captureInterval) clearInterval(captureInterval);
            captureInterval = setInterval(() => {
                if (video.videoWidth > 0 && !isProcessing) analyzeFrame();
            }, 300);
        }

        function analyzeFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: canvas.toDataURL('image/jpeg'), frame_height: canvas.height })
            })
            .then(res => res.json())
            .then(data => {
                if (data.pixel_length) {
                    const ratio = data.pixel_length / (canvas.height * 0.6);
                    const percent = Math.min(100, ratio * 100);
                    document.getElementById('distanceFill').style.width = percent + '%';
                    
                    if (percent > 85 && percent < 105 && !isProcessing) {
                        // Green zone - auto capture
                        document.getElementById('borderGuide').classList.add('perfect');
                        document.getElementById('instruction').innerHTML = '✅ Capturing...';
                        isProcessing = true;
                        clearInterval(captureInterval);
                        setTimeout(() => capturePhoto(), 200);
                    } else {
                        document.getElementById('borderGuide').classList.remove('perfect');
                        document.getElementById('instruction').innerHTML = '📱 Move until green line fills';
                    }
                } else {
                    document.getElementById('distanceFill').style.width = '0%';
                    document.getElementById('borderGuide').classList.remove('perfect');
                }
            })
            .catch(err => {
                console.log('Analysis error');
            });
        }

        function capturePhoto() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            document.getElementById('loader').style.display = 'block';

            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData, frame_height: canvas.height })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                
                if (data.success && data.foot_cm) {
                    sessionStorage.setItem('measureResult', JSON.stringify(data));
                    window.location.href = '/result';
                } else {
                    showToast('⚠️ Foot not detected. Please try again.');
                    resetAndRecapture();
                }
            })
            .catch(err => {
                document.getElementById('loader').style.display = 'none';
                showToast('⚠️ Could not analyze. Please try again.');
                resetAndRecapture();
            });
        }

        function resetAndRecapture() {
            isProcessing = false;
            document.getElementById('borderGuide').classList.remove('perfect');
            document.getElementById('instruction').innerHTML = '📱 Move until green line fills';
            document.getElementById('distanceFill').style.width = '0%';
            if (captureInterval) clearInterval(captureInterval);
            startAutoDetection();
        }

        startCamera();
    </script>
</body>
</html>
