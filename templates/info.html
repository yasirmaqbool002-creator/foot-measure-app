<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Foot Size Detector - Info</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 1.8em; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
        }
        .age-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .age-btn {
            padding: 12px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .age-btn.selected { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }
        .gender-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .gender-btn {
            flex: 1;
            padding: 12px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
        }
        .gender-btn.selected { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-color: transparent; }
        .btn-next {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        input[type="hidden"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>🤖 AI Foot Size Detector</h1>
                <p>Your Smart Shoe Size Assistant</p>
            </div>
            
            <form method="POST">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label>Age (years)</label>
                    <input type="number" name="age" id="age" required placeholder="25" value="25">
                </div>
                
                <div class="form-group">
                    <label>Age Group</label>
                    <div class="age-group">
                        <div class="age-btn" data-category="infant">👶 Infant (0-1)</div>
                        <div class="age-btn" data-category="toddler">🚼 Toddler (1-4)</div>
                        <div class="age-btn" data-category="child">🧒 Child (5-12)</div>
                        <div class="age-btn" data-category="teen">👦 Teen (13-17)</div>
                        <div class="age-btn" data-category="adult" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">👨 Adult (18+)</div>
                    </div>
                    <input type="hidden" name="age_category" id="ageCategory" value="adult">
                </div>
                
                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-group">
                        <div class="gender-btn" data-gender="male">👨 Male</div>
                        <div class="gender-btn" data-gender="female">👩 Female</div>
                        <div class="gender-btn" data-gender="unisex">🌈 Unisex</div>
                    </div>
                    <input type="hidden" name="gender" id="gender" value="unisex">
                </div>
                
                <button type="submit" class="btn-next">Continue →</button>
            </form>
        </div>
    </div>
    
    <script>
        let selectedCategory = 'adult';
        let selectedGender = 'unisex';
        
        document.querySelectorAll('.age-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedCategory = btn.dataset.category;
                document.getElementById('ageCategory').value = selectedCategory;
                
                const ageInput = document.getElementById('age');
                if (selectedCategory === 'infant') ageInput.value = 1;
                else if (selectedCategory === 'toddler') ageInput.value = 2;
                else if (selectedCategory === 'child') ageInput.value = 8;
                else if (selectedCategory === 'teen') ageInput.value = 15;
                else ageInput.value = 25;
            });
        });
        
        document.querySelectorAll('.gender-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedGender = btn.dataset.gender;
                document.getElementById('gender').value = selectedGender;
            });
        });
    </script>
</body>
</html>
