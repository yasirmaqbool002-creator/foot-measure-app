<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Foot Measure - Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #764ba2; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .feature-list {
            text-align: left;
            margin: 30px 0;
            padding-left: 20px;
        }
        .feature-list li {
            margin: 10px 0;
            color: #555;
        }
        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        .btn-start:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">👟</div>
            <h1>Smart Foot Measure</h1>
            <div class="subtitle">AI-powered foot measurement for the whole family</div>
            
            <div class="feature-list">
                <li>📱 Auto-capture when perfect distance</li>
                <li>👶 Special sizes for infants, toddlers & children</li>
                <li>📈 Track your child's foot growth</li>
                <li>👞 US, UK & EU shoe sizes</li>
                <li>🆓 Completely free</li>
            </div>
            
            <button class="btn-start" onclick="window.location.href='/info'">Start Measuring →</button>
        </div>
    </div>
</body>
</html>
