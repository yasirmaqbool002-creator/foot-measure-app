<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Foot Measure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .camera-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .camera-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #video, #canvas {
            width: 100%;
            border-radius: 15px;
        }
        #canvas { display: none; }
        .border-guide {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            height: 60%;
            border: 3px dashed white;
            border-radius: 30px;
            pointer-events: none;
            transition: all 0.3s;
        }
        .border-guide.perfect {
            border: 3px solid #4caf50;
            box-shadow: 0 0 20px rgba(76,175,80,0.5);
        }
        .distance-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .distance-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }
        .instruction {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        select, .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
        select {
            background: #f0f0f0;
        }
        .btn-capture {
            background: #4caf50;
            color: white;
            cursor: pointer;
        }
        .btn-recapture {
            background: #ff9800;
            color: white;
            cursor: pointer;
        }
        .btn-reset {
            background: #764ba2;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results {
            display: none;
            margin-top: 20px;
        }
        .info-box {
            background: #e8f5e9;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .size-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .size-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .size-label { font-size: 14px; opacity: 0.9; }
        .size-value { font-size: 28px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👟 Smart Foot Measure</h1>
            <p>Place your foot in the frame</p>
        </div>

        <div class="camera-card">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="border-guide" id="borderGuide"></div>
                <div class="distance-bar">
                    <div class="distance-fill" id="distanceFill"></div>
                </div>
                <div class="instruction" id="instruction">
                    📱 Move camera until foot fills the outline
                </div>
            </div>

            <div class="controls">
                <select id="gender">
                    <option value="unisex">👤 Unisex</option>
                    <option value="male">👨 Male</option>
                    <option value="female">👩 Female</option>
                </select>
            </div>

            <div class="button-group" id="buttonGroup">
                <button class="btn-capture" id="captureBtn" onclick="manualCapture()">📸 Capture Foot</button>
                <button class="btn-recapture" id="recaptureBtn" onclick="resetAndRecapture()" style="display:none;">🔄 Recapture</button>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>AI analyzing your foot...</p>
            </div>

            <div class="results" id="results">
                <h3 style="color: #764ba2; text-align: center;">📊 Your Results</h3>
                <div class="info-box">
                    <strong>📏 Foot Length:</strong> <span id="footLength">--</span> cm
                </div>
                <div class="size-grid">
                    <div class="size-card">
                        <div class="size-label">🇺🇸 US Size</div>
                        <div class="size-value" id="usSize">-</div>
                    </div>
                    <div class="size-card">
                        <div class="size-label">🇬🇧 UK Size</div>
                        <div class="size-value" id="ukSize">-</div>
                    </div>
                    <div class="size-card">
                        <div class="size-label">🇪🇺 EU Size</div>
                        <div class="size-value" id="euSize">-</div>
                    </div>
                </div>
                <button class="btn-reset" onclick="resetApp()">📷 Measure Another Foot</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const borderGuide = document.getElementById('borderGuide');
        const distanceFill = document.getElementById('distanceFill');
        const instruction = document.getElementById('instruction');
        const captureBtn = document.getElementById('captureBtn');
        const recaptureBtn = document.getElementById('recaptureBtn');
        let stream = null;
        let captureInterval = null;
        let isAutoCaptureEnabled = true;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    startAutoDetection();
                };
            } catch (err) {
                instruction.innerText = '❌ Camera access denied';
                console.error(err);
            }
        }

        function startAutoDetection() {
            captureInterval = setInterval(() => {
                if (video.videoWidth > 0 && isAutoCaptureEnabled) {
                    analyzeFrame();
                }
            }, 500);
        }

        function analyzeFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'frame.jpg');
                formData.append('gender', document.getElementById('gender').value);
                formData.append('frame_height', canvas.height);
                
                fetch('/analyze', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.pixel_length) {
                        const pixelLength = data.pixel_length;
                        const optimal = canvas.height * 0.6;
                        const ratio = pixelLength / optimal;
                        let distancePercent = Math.min(100, ratio * 100);
                        distanceFill.style.width = distancePercent + '%';
                        
                        if (ratio > 0.85 && ratio < 1.05) {
                            borderGuide.classList.add('perfect');
                            instruction.innerText = '✅ Perfect distance! Click Capture';
                            instruction.style.background = 'rgba(76, 175, 80, 0.9)';
                        } else if (ratio < 0.7) {
                            borderGuide.classList.remove('perfect');
                            instruction.innerText = '📱 Move CLOSER to your foot';
                            instruction.style.background = 'rgba(0,0,0,0.7)';
                            distanceFill.style.background = '#ff5722';
                        } else {
                            borderGuide.classList.remove('perfect');
                            instruction.innerText = '📱 Move FARTHER from your foot';
                            instruction.style.background = 'rgba(0,0,0,0.7)';
                            distanceFill.style.background = '#ff5722';
                        }
                    }
                })
                .catch(err => console.log('Detection error:', err));
            }, 'image/jpeg');
        }

        function manualCapture() {
            if (!isAutoCaptureEnabled) return;
            
            isAutoCaptureEnabled = false;
            if (captureInterval) clearInterval(captureInterval);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'foot.jpg');
                formData.append('gender', document.getElementById('gender').value);
                formData.append('frame_height', canvas.height);
                
                document.getElementById('loader').style.display = 'block';
                captureBtn.style.display = 'none';
                recaptureBtn.style.display = 'block';
                
                fetch('/analyze', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    
                    if (data.success) {
                        document.getElementById('footLength').textContent = data.foot_cm;
                        document.getElementById('usSize').textContent = data.sizes.US;
                        document.getElementById('ukSize').textContent = data.sizes.UK;
                        document.getElementById('euSize').textContent = data.sizes.EU;
                        document.getElementById('results').style.display = 'block';
                        instruction.innerText = '✅ Measurement complete!';
                    } else {
                        instruction.innerText = '❌ Could not detect foot. Try again.';
                        isAutoCaptureEnabled = true;
                        captureBtn.style.display = 'block';
                        recaptureBtn.style.display = 'none';
                        if (captureInterval) startAutoDetection();
                    }
                });
            }, 'image/jpeg');
        }

        function resetAndRecapture() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            captureBtn.style.display = 'block';
            recaptureBtn.style.display = 'none';
            isAutoCaptureEnabled = true;
            distanceFill.style.width = '0%';
            borderGuide.classList.remove('perfect');
            instruction.innerText = '📱 Move camera until foot fills the outline';
            instruction.style.background = 'rgba(0,0,0,0.7)';
            
            if (captureInterval) clearInterval(captureInterval);
            startAutoDetection();
        }

        function resetApp() {
            resetAndRecapture();
        }

        startCamera();
    </script>
</body>
</html>
