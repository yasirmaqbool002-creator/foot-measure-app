<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Foot Measure - AI Foot Size Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .camera-card {
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .border-guide {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 4px solid #ff4444;
            border-radius: 20px;
            transition: border-color 0.1s;
            pointer-events: none;
            z-index: 10;
        }

        .border-guide.perfect {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .foot-outline {
            position: absolute;
            bottom: 20%;
            left: 15%;
            right: 15%;
            height: 40%;
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 60px 60px 30px 30px;
            pointer-events: none;
            z-index: 10;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 10;
        }

        .distance-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
            z-index: 10;
        }

        .distance-fill {
            height: 100%;
            width: 0%;
            background: #4CAF50;
            transition: width 0.1s;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        select, button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        select {
            background: #f0f0f0;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: bold;
        }

        .results {
            display: none;
            margin-top: 20px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .size-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .size-card {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .size-label {
            font-size: 12px;
            color: #666;
        }

        .size-value {
            font-size: 28px;
            font-weight: bold;
            color: #764ba2;
        }

        .info-box {
            background: #e8f5e9;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #764ba2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-reset {
            background: #764ba2;
            color: white;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👟 Smart Foot Measure</h1>
            <p>Place your foot in the frame - we'll auto-capture!</p>
        </div>

        <div class="camera-card">
            <div class="camera-container" id="cameraContainer">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                <div class="border-guide" id="borderGuide"></div>
                <div class="foot-outline"></div>
                <div class="distance-bar">
                    <div class="distance-fill" id="distanceFill"></div>
                </div>
                <div class="instruction" id="instruction">
                    📱 Move camera until foot fills the outline
                </div>
            </div>

            <div class="controls">
                <select id="gender">
                    <option value="unisex">👤 Unisex</option>
                    <option value="male">👨 Male</option>
                    <option value="female">👩 Female</option>
                </select>
                <button onclick="manualCapture()">📸 Capture Now</button>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>AI analyzing your foot...</p>
            </div>

            <div class="results" id="results">
                <h3 style="color: #764ba2; text-align: center;">📊 Your Results</h3>
                <div class="info-box">
                    <strong>📏 Foot Length:</strong> <span id="footLength">--</span> cm
                </div>
                <div class="size-grid">
                    <div class="size-card">
                        <div class="size-label">🇺🇸 US Size</div>
                        <div class="size-value" id="usSize">-</div>
                    </div>
                    <div class="size-card">
                        <div class="size-label">🇬🇧 UK Size</div>
                        <div class="size-value" id="ukSize">-</div>
                    </div>
                    <div class="size-card">
                        <div class="size-label">🇪🇺 EU Size</div>
                        <div class="size-value" id="euSize">-</div>
                    </div>
                </div>
                <button class="btn-reset" onclick="resetApp()">📷 Measure Another Foot</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const borderGuide = document.getElementById('borderGuide');
        const distanceFill = document.getElementById('distanceFill');
        const instruction = document.getElementById('instruction');
        let stream = null;
        let captureInterval = null;
        let isAutoCaptureEnabled = true;

        // Start camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                await video.play();
                
                // Set canvas size
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                startAutoDetection();
            } catch (err) {
                instruction.innerText = '❌ Camera access denied. Please allow camera.';
                console.error(err);
            }
        }

        function startAutoDetection() {
            captureInterval = setInterval(() => {
                if (video.videoWidth > 0 && isAutoCaptureEnabled) {
                    analyzeFrame();
                }
            }, 500);
        }

        function analyzeFrame() {
            // Draw current frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Get frame as base64
            const frameData = canvas.toDataURL('image/jpeg');
            const frameHeight = canvas.height;
            
            // Quick foot detection using backend
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: frameData,
                    frame_height: frameHeight,
                    gender: document.getElementById('gender').value
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.pixel_length) {
                    const pixelLength = data.pixel_length;
                    const optimal = canvas.height * 0.6;
                    const ratio = pixelLength / optimal;
                    
                    let distancePercent = Math.min(100, ratio * 100);
                    distanceFill.style.width = distancePercent + '%';
                    
                    if (ratio > 0.85 && ratio < 1.05) {
                        borderGuide.classList.add('perfect');
                        instruction.innerText = '✅ Perfect distance! Auto-capturing...';
                        instruction.style.background = 'rgba(76, 175, 80, 0.9)';
                        
                        if (isAutoCaptureEnabled) {
                            isAutoCaptureEnabled = false;
                            setTimeout(() => autoCapture(), 500);
                        }
                    } else if (ratio < 0.7) {
                        borderGuide.classList.remove('perfect');
                        instruction.innerText = '📱 Move CLOSER to your foot';
                        instruction.style.background = 'rgba(0,0,0,0.7)';
                        distanceFill.style.background = '#ff5722';
                    } else {
                        borderGuide.classList.remove('perfect');
                        instruction.innerText = '📱 Move FARTHER from your foot';
                        instruction.style.background = 'rgba(0,0,0,0.7)';
                        distanceFill.style.background = '#ff5722';
                    }
                }
            })
            .catch(err => console.log('Detection error:', err));
        }

        function autoCapture() {
            // Capture final photo
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            
            document.getElementById('loader').style.display = 'block';
            
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: imageData,
                    frame_height: canvas.height,
                    gender: document.getElementById('gender').value
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                
                if (data.success) {
                    document.getElementById('footLength').textContent = data.foot_cm;
                    document.getElementById('usSize').textContent = data.sizes.US;
                    document.getElementById('ukSize').textContent = data.sizes.UK;
                    document.getElementById('euSize').textContent = data.sizes.EU;
                    document.getElementById('results').style.display = 'block';
                    
                    // Stop auto detection
                    if (captureInterval) {
                        clearInterval(captureInterval);
                    }
                } else {
                    instruction.innerText = '❌ Could not detect foot. Try again.';
                    setTimeout(() => {
                        isAutoCaptureEnabled = true;
                        instruction.innerText = '📱 Move camera until foot fills the outline';
                        instruction.style.background = 'rgba(0,0,0,0.7)';
                    }, 2000);
                }
            });
        }

        function manualCapture() {
            isAutoCaptureEnabled = false;
            autoCapture();
        }

        function resetApp() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            isAutoCaptureEnabled = true;
            distanceFill.style.width = '0%';
            borderGuide.classList.remove('perfect');
            instruction.innerText = '📱 Move camera until foot fills the outline';
            instruction.style.background = 'rgba(0,0,0,0.7)';
            
            if (captureInterval) {
                clearInterval(captureInterval);
            }
            startAutoDetection();
        }

        // Start app
        startCamera();
    </script>
</body>
</html>
